<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reports | Student Management System</title>
<link rel="stylesheet" href="style.css">
</head>
<body data-page="reports">
<div class="layout">
<aside class="sidebar" id="sidebar"></aside>
<main class="main">
<header class="top"><button id="menuBtn" aria-label="Open menu">☰</button><h1>Reports</h1><span class="date"></span></header>
<section class="cards" id="stats"></section>
<div class="tools"><button class="btn" id="expS">Download students (CSV)</button><button class="btn" id="expR">Download results (CSV)</button><button class="btn alt" id="print">Print report</button></div>
<div class="grid2">
<section class="panel"><h2>Grade distribution</h2><div id="gb"></div></section>
<section class="panel"><h2>Course summary</h2><div class="tw"><table><thead><tr><th>Course</th><th>Students</th><th>Average mark</th></tr></thead><tbody id="ct"></tbody></table></div></section>
</div>
<section class="panel"><h2>Attendance by student</h2><div class="tw"><table><thead><tr><th>Student</th><th>Days attended</th><th>Rate</th></tr></thead><tbody id="at"></tbody></table></div></section>
</main>
</div>
<script src="script.js"></script>
</body>
</html>
